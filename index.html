<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>記憶重構 - 沉浸式視覺搜查版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #080808; color: #e5e5e5; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        #game-container { width: 100%; max-width: 480px; height: 100vh; max-height: 880px; background: #121212; display: flex; flex-direction: column; position: relative; overflow: hidden; border: 1px solid #222; }
        @media (min-width: 481px) { #game-container { border-radius: 16px; height: 92vh; box-shadow: 0 0 30px rgba(0,0,0,0.9); } }
        
        header { background: #1a1a1a; padding: 12px 15px; text-align: center; border-bottom: 2px solid #b91c1c; }
        header h1 { font-size: 1.1rem; color: #f87171; letter-spacing: 2px; }
        .stage-indicator { font-size: 0.8rem; color: #9ca3af; margin-top: 3px; }
        
        .content-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        /* 擬真房間視覺卡片 */
        .room-view { width: 100%; height: 150px; background: #1a1a1a; border-radius: 10px; border: 1px dashed #444; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 15px; position: relative; }
        .room-view h3 { color: #fbbf24; font-size: 0.95rem; margin-bottom: 5px; }
        .room-view p { color: #9ca3af; font-size: 0.8rem; line-height: 1.4; }

        .search-area-title { font-size: 0.85rem; color: #38bdf8; font-weight: bold; margin-top: 5px; text-align: center; }
        .search-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .search-btn { background: #1f1f1f; border: 1px solid #333; color: #f3f4f6; padding: 12px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .search-btn:active { background: #b91c1c; transform: scale(0.98); }
        
        .story-box { background: #1a1a1a; padding: 12px 15px; border-radius: 8px; border-left: 4px solid #b91c1c; font-size: 0.9rem; line-height: 1.6; color: #f3f4f6; }
        
        .puzzle-box { background: #1a1a1a; padding: 12px 15px; border-radius: 8px; text-align: center; border: 1px solid #333; }
        .puzzle-box p { font-size: 0.85rem; margin-bottom: 10px; color: #fbbf24; font-weight: 500; }
        
        input[type="password"], input[type="text"] { width: 100%; padding: 12px; font-size: 1.2rem; text-align: center; background: #0b0b0b; border: 1px solid #4b5563; border-radius: 6px; color: #34d399; letter-spacing: 4px; font-family: monospace; margin-bottom: 10px; }
        button.submit-btn { width: 100%; padding: 12px; background: #b91c1c; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button.submit-btn:active { background: #991b1b; }
        
        .footer-nav { display: flex; gap: 10px; padding: 12px 15px; background: #1a1a1a; border-top: 1px solid #333; }
        .footer-nav button { flex: 1; padding: 10px; background: #374151; color: white; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }
        .footer-nav button.primary { background: #b91c1c; }
        
        /* 翻找特寫彈窗 (模擬拿在手上檢視) */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 100; display: none; }
        .modal-content { background: #1f2937; padding: 20px; border-radius: 12px; max-width: 400px; width: 100%; text-align: center; border: 1px solid #4b5563; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-content h3 { color: #fbbf24; margin-bottom: 12px; font-size: 1.1rem; }
        .modal-content p { font-size: 0.9rem; line-height: 1.6; color: #d1d5db; text-align: left; margin-bottom: 15px; background: #111827; padding: 12px; border-radius: 6px; border: 1px dashed #374151; }
        .modal-content button { padding: 10px 20px; background: #fbbf24; border: none; border-radius: 6px; color: #000; font-weight: bold; width: 100%; }

        .remote-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .remote-btn { padding: 12px 5px; background: #374151; color: #fff; border: 1px solid #4b5563; border-radius: 6px; font-size: 0.8rem; }
        .remote-btn.home-target { background: #ea580c; border-color: #f97316; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <h1 id="game-title">記憶重構</h1>
        <div class="stage-indicator" id="stage-indicator">第一關：臥室（槍傷驚醒）</div>
    </header>

    <div class="content-area" id="content-area"></div>

    <div class="footer-nav">
        <button onclick="showHint()">💡 搜查提示</button>
        <button class="primary" onclick="restartGame()">🔄 重新開始</button>
    </div>
</div>

<div class="modal" id="game-modal">
    <div class="modal-content">
        <h3 id="modal-title">證物檢視</h3>
        <p id="modal-text">細節內容...</p>
        <button onclick="closeModal()">放回原處</button>
    </div>
</div>

            story: "你猛然驚醒，頭痛欲裂。必須在凌亂的臥室裡翻找當初加入幫派的證據。",

            story: "床頭的物件透露出信仰與殘酷的病理現實。",
            searchButtons: [

                { title: "🔍 抽開下方的重症病歷紙", text: "病歷上寫著：『加護病房編號 ICU-08，病歷號末碼 1299。』" }

        },

                { title: "🔍 檢查保險箱底層夾層", text: "裡面躺著兩張單程機票與資產轉移單，簽名全都是東翰的名字。" }
            ],
            puzzleTitle: "請輸入書房保險箱的暗號密碼 (6位數)",

            answer: "080713",

            next: 8
        },
        8: {
            title: "第八關：客廳電視（遙控器謎語）",

            story: "電視螢幕呈現黑畫面，必須找到東翰留下的回家標記。",
            searchButtons: [
                { title: "🔍 拿起遙控器閱讀旁邊的字條", text: "字條寫著：『敬偉，你總說黑色太冷...第一次把你緊緊抱在懷裡那天，陽光把天空染成了最溫暖的顏色。找到遙控器上那個顏色的標籤，那是我留給你的回家符號。』" }
            ],
            puzzleTitle: "請點擊遙控器上貼著橘色貼紙的正確按鈕",

                { title: "🔍 拿起鞋櫃角落的機票確認", text: "仔細一看機票，上面寫著兩人的名字。原來東翰不是要背叛，而是安排好一切準備帶你離開黑幫！" }
            ],
            puzzleTitle: "請輸入兩人告白的日期 (4位數 MMDD)",
            type: "input",
            answer: "0807",

        },
        10: {
            title: "第十關：大門口（終極命運抉擇）",

            story: "大門前，你的每一次翻找與抉擇，將導向截然不同的結局。",
            searchButtons: [
                { title: "🔍 回憶【真相拼圖】兩人生日加總", text: "林敬偉生日 2003.02.15 (2003+2+15 = 2020)<br>李東翰生日 2000.04.10 (2000+4+10 = 2014)<br>總和：💚 <b>4034</b> (信任與真相)" },
                { title: "🔍 回憶【黑道叛變線索】帳本匯款", text: "黑道代碼與匯款日 🖤 <b>791300</b> / <b>080713</b> (幫派背叛)" },
                { title: "🔍 回憶【精神病患線索】加護病房", text: "精神科創傷病歷號 💔 <b>081299</b> (孤獨幻覺)" }
            ],

    function renderStage() {
        const stage = stages[currentStage];
        document.getElementById("game-title").innerText = "記憶重構";
        document.getElementById("stage-indicator").innerText = stage.title;

        let searchBtnsHtml = "";
        if (stage.searchButtons) {
            searchBtnsHtml = `<div class="search-area-title">👇 點擊下方物品進行現場翻找：</div><div class="search-grid">`;
            stage.searchButtons.forEach((btn, idx) => {
                searchBtnsHtml += `<button class="search-btn" onclick="inspectDetail(${idx})">${btn.title}</button>`;
            });
            searchBtnsHtml += `</div>`;
        }

        let html = `
            <div class="room-view">
                <h3>${stage.title}</h3>
                <p>${stage.roomDesc}</p>
            </div>
            <div class="story-box">${stage.story}</div>
            ${searchBtnsHtml}
        `;

        if (stage.type === "input") {
            html += `
                <div class="puzzle-box">
                    <p>${stage.puzzleTitle}</p>
                    <input type="password" id="user-input" placeholder="輸入密碼..." autocomplete="off">
                    <button class="submit-btn" onclick="checkInput()">確認解鎖</button>
                </div>
            `;
        } else if (stage.type === "remote") {
            html += `
                <div class="puzzle-box">
                    <p>${stage.puzzleTitle}</p>
                    <div class="remote-grid">
                        <button class="remote-btn" onclick="wrongRemote()">電源</button>
                        <button class="remote-btn" onclick="wrongRemote()">選單</button>
                        <button class="remote-btn home-target" onclick="correctRemote()">🏠 HOME (橘)</button>
                        <button class="remote-btn" onclick="wrongRemote()">音量+</button>
                        <button class="remote-btn" onclick="wrongRemote()">頻道+</button>
                        <button class="remote-btn" onclick="wrongRemote()">返回</button>
                    </div>
                </div>
            `;
        }

        document.getElementById("content-area").innerHTML = html;
    }

    function inspectDetail(index) {
        const stage = stages[currentStage];
        const item = stage.searchButtons[index];
        document.getElementById("modal-title").innerText = item.title;
        document.getElementById("modal-text").innerHTML = item.text;
        document.getElementById("game-modal").style.display = "flex";
    }

    function checkInput() {
        const val = document.getElementById("user-input").value.trim();
        const stage = stages[currentStage];

        if (currentStage === 10) {
            if (val === "4034") showEnding("good");
            else if (val === "791300" || val === "080713") showEnding("bad1");
            else if (val === "081299") showEnding("bad2");
            else alert("密碼錯誤！請再次翻找房間內的證物。");
            return;
        }

        if (val === stage.answer || (currentStage === 7 && (val === "791300" || val === "080713"))) {
            if (currentStage === 7 && (val === "791300" || val === "080713")) {
                alert("保險箱彈開，裡面全是黑道密件，讓你對東翰的信任開始動搖...");
            } else {
                alert("解密成功！");
            }
            currentStage = stage.next;
            renderStage();
        } else {
            alert("密碼不正確！請點擊上方物品按鈕仔細翻找細節。");
        }
    }

    function correctRemote() {
        alert("電視亮起，東翰留下的溫柔影片播放... 通關！");
        currentStage = 9;
        renderStage();
    }

    function wrongRemote() { alert("按鍵無反應，再看看橘色貼紙的謎語！"); }

    function showEnding(type) {
        let title = "", text = "";
        if (type === "good") {
            title = "💚 好結局：留一盞燈給你 (4034)";
            text = "大門緩緩打開，外面是安靜的走廊。東翰提著熱粥與胃藥站在門口，笑著對他說：『你重新經歷過我們的生活了對不對？就算全部忘記也沒關係，我們可以再體驗一次……我都在。』";
        } else if (type === "bad1") {
            title = "🖤 壞結局一：撕開的溫柔 (791300 / 080713)";
            text = "大門打開後空無一人，鞋櫃上留著一封信與機票。信上揭露了幫派奪權與臥底的殘酷真相，溫柔的陪伴全成了精心計算的佈局。";
        } else if (type === "bad2") {
            title = "💔 壞結局二：荒蕪的夢 (081299)";
            text = "大門打開後是一片漆黑廢墟與殘破毛胚屋，回頭看所謂的溫馨家園其實全不存在。一切只是重度腦傷與失智下的孤獨幻想。";
        }

        document.getElementById("content-area").innerHTML = `
            <div class="story-box" style="border-left-color: #b91c1c; padding: 20px;">
                <h2 style="color:#fbbf24; margin-bottom:10px;">${title}</h2>
                <p style="line-height: 1.8;">${text}</p>
            </div>
            <button onclick="restartGame()" class="submit-btn" style="background:#2563eb; margin-top:15px;">重新開始體驗</button>
        `;
        document.getElementById("stage-indicator").innerText = "遊戲劇終";
    }

    function showHint() {
        const stage = stages[currentStage];
        document.getElementById("modal-title").innerText = "💡 搜查提示";
        document.getElementById("modal-text").innerHTML = stage.hint;
        document.getElementById("game-modal").style.display = "flex";
    }

    function closeModal() { document.getElementById("game-modal").style.display = "none"; }
    function restartGame() { currentStage = 1; renderStage(); }

    renderStage();
</script>

</body>
</html>
