<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>記憶重構 - 台灣在地密室逃脫</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d0d0d; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        #game-container { width: 100%; max-width: 480px; height: 100vh; max-height: 880px; background: #1a1a1a; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        @media (min-width: 481px) { #game-container { border-radius: 16px; height: 92vh; border: 1px solid #333; box-shadow: 0 0 30px rgba(0,0,0,0.9); } }
        
        header { background: #242424; padding: 12px 15px; text-align: center; border-bottom: 2px solid #b45309; }
        header h1 { font-size: 1.1rem; color: #f59e0b; letter-spacing: 2px; }
        .stage-indicator { font-size: 0.8rem; color: #9ca3af; margin-top: 3px; }
        
        .content-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        /* 插圖畫布區域 */
        .scene-canvas { width: 100%; height: 180px; background: #111; border-radius: 8px; border: 1px solid #333; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        .interactive-btn { position: absolute; background: rgba(245, 158, 11, 0.2); border: 2px dashed #f59e0b; color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; cursor: pointer; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
        
        .story-box { background: #262626; padding: 12px 15px; border-radius: 8px; border-left: 4px solid #f59e0b; font-size: 0.9rem; line-height: 1.5; color: #e5e5e5; }
        
        .puzzle-box { background: #262626; padding: 12px 15px; border-radius: 8px; text-align: center; border: 1px solid #3b3b3b; }
        .puzzle-box p { font-size: 0.85rem; margin-bottom: 10px; color: #fbbf24; font-weight: 500; }
        
        input[type="password"], input[type="text"] { width: 100%; padding: 12px; font-size: 1.2rem; text-align: center; background: #121212; border: 1px solid #4b5563; border-radius: 6px; color: #34d399; letter-spacing: 4px; font-family: monospace; margin-bottom: 10px; }
        button.submit-btn { width: 100%; padding: 12px; background: #d97706; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button.submit-btn:active { background: #b45309; }
        
        .footer-nav { display: flex; gap: 10px; padding: 12px 15px; background: #242424; border-top: 1px solid #333; }
        .footer-nav button { flex: 1; padding: 10px; background: #374151; color: white; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }
        .footer-nav button.primary { background: #d97706; }
        
        /* 彈窗與調查卡片 */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 100; display: none; }
        .modal-content { background: #1f2937; padding: 20px; border-radius: 12px; max-width: 400px; width: 100%; text-align: center; border: 1px solid #4b5563; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-content h3 { color: #f59e0b; margin-bottom: 12px; font-size: 1.1rem; }
        .modal-content p { font-size: 0.9rem; line-height: 1.6; color: #d1d5db; text-align: left; margin-bottom: 15px; }
        .modal-content button { padding: 10px 20px; background: #f59e0b; border: none; border-radius: 6px; color: #000; font-weight: bold; width: 100%; }

        /* 遙控器網格 */
        .remote-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .remote-btn { padding: 12px 5px; background: #374151; color: #fff; border: 1px solid #4b5563; border-radius: 6px; font-size: 0.8rem; }
        .remote-btn.home-target { background: #ea580c; border-color: #f97316; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <h1 id="game-title">記憶重構</h1>
        <div class="stage-indicator" id="stage-indicator">第一關：臥室（槍傷驚醒）</div>
    </header>

    <div class="content-area" id="content-area"></div>

    <div class="footer-nav">
        <button onclick="showHint()">💡 線索提示</button>
        <button class="primary" onclick="restartGame()">🔄 重新開始</button>
    </div>
</div>

<div class="modal" id="game-modal">
    <div class="modal-content">
        <h3 id="modal-title">物品調查結果</h3>
        <p id="modal-text">詳細資訊...</p>
        <button onclick="closeModal()">收起線索</button>
    </div>
</div>

            svg: `<svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>`,
            btnText: "🔍 調查床頭櫃平安符與文件",
            story: "床頭壓著大甲鎮瀾宮的平安符，下面還夾著一張病危通知單...",
            inspectTitle: "🔍 調查細節：平安符與病歷",
            inspectText: "【平安符紅包】：『大甲媽祖聖誕求得，保佑敬偉平安（農曆三月二十三日）。』<br>【病危通知單】：『神經內科病歷號 ICU-08，加護病房日期 1299。』",

        },
        7: {
            title: "第七關：書房（幫派帳本與保險箱）",

            inspectTitle: "🔍 調查細節：保險箱線索",
            inspectText: "【黑龍會徽章】：標有代碼『HL-08』。<br>【匯款單】：東翰簽名的轉帳單，日期為『0713』。<br>【暗示】：組合徽章與日期 (080713) 或幫派暗號 (791300) 可開啟保險箱。",

            btnText: "🔍 閱讀遙控器旁的貼紙謎語",
            story: "智慧電視遙控器上貼滿標籤，旁邊留著東翰的筆跡...",
            inspectTitle: "🔍 調查細節：東翰留下的便利貼",
            inspectText: "『敬偉，你總說黑色太冷...但你記得嗎？你第一次把我緊緊抱在懷裡的那天，陽光把天空染成了最溫暖的顏色。找到遙控器上那個顏色的標籤，那是我留給你的回家（HOME）符號。』",
            puzzleTitle: "請點擊遙控器上貼著橘色貼紙的按鈕",
            type: "remote",
            next: 9
        },
        9: {
            title: "第九關：玄關（鹽酥雞告白）",
            story: "站在玄關鞋櫃前，你看到鞋櫃角落放著一張單程機票...",
            svg: `<svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`,
            btnText: "🔍 查看鞋櫃機票與舊照片",
            inspectTitle: "🔍 調查細節：機票與舊照片",
            inspectText: "【舊照片】：巷口鹽酥雞攤前，東翰滿嘴食物告白的合照，背面寫著『2023.08.07 告白成功』。<br>【單程機票】：飛往東南亞，姓名為李東翰。",

            next: 10
        },
        10: {
            title: "第十關：大門（終極命運抉擇）",
            svg: `<svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
            btnText: "🔍 總覽門口電子鎖線索",
            story: "終於來到大門前。電子鎖閃爍著紅光，你需要做出選擇：選擇相信東翰？還是被懷疑與幻覺吞噬？",
            inspectTitle: "🔍 電子鎖提示說明",
            inspectText: "【好結局】：將兩人生日年月日數字全部相加（林敬偉 2003.02.15 + 李東翰 2000.04.10 = 2020 + 2014 = 4034）。<br>【壞結局一】：輸入黑道叛變暗號 791300。<br>【壞結局二】：輸入創傷病房號碼 081299。",

            next: "end"
        }
    };

    function renderStage() {
        const stage = stages[currentStage];
        document.getElementById("game-title").innerText = "記憶重構";
        document.getElementById("stage-indicator").innerText = stage.title;

        let html = `
            <div class="scene-canvas">
                ${stage.svg}
                <button class="interactive-btn" onclick="inspectItem()">${stage.btnText}</button>
            </div>
            <div class="story-box">${stage.story}</div>
        `;

        if (stage.type === "input") {
            html += `
                <div class="puzzle-box">
                    <p>${stage.puzzleTitle}</p>
                    <input type="password" id="user-input" placeholder="輸入密碼..." autocomplete="off">
                    <button class="submit-btn" onclick="checkInput()">確認解鎖</button>
                </div>
            `;
        } else if (stage.type === "remote") {
            html += `
                <div class="puzzle-box">
                    <p>${stage.puzzleTitle}</p>
                    <div class="remote-grid">
                        <button class="remote-btn" onclick="wrongRemote()">電源</button>
                        <button class="remote-btn" onclick="wrongRemote()">選單</button>
                        <button class="remote-btn home-target" onclick="correctRemote()">🏠 HOME (橘)</button>
                        <button class="remote-btn" onclick="wrongRemote()">音量+</button>
                        <button class="remote-btn" onclick="wrongRemote()">頻道+</button>
                        <button class="remote-btn" onclick="wrongRemote()">返回</button>
                    </div>
                </div>
            `;
        }

        document.getElementById("content-area").innerHTML = html;
    }

    function inspectItem() {
        const stage = stages[currentStage];
        document.getElementById("modal-title").innerText = stage.inspectTitle;
        document.getElementById("modal-text").innerHTML = stage.inspectText;
        document.getElementById("game-modal").style.display = "flex";
    }

    function checkInput() {
        const val = document.getElementById("user-input").value.trim();
        const stage = stages[currentStage];

        if (currentStage === 10) {
            if (val === "4034") showEnding("good");
            else if (val === "791300" || val === "080713") showEnding("bad1");
            else if (val === "081299") showEnding("bad2");
            else alert("密碼錯誤！請確認線索或查閱提示。");
            return;
        }

        if (val === stage.answer || (currentStage === 7 && val === "791300")) {
            alert("解密成功！進入下一關。");
            currentStage = stage.next;
            renderStage();
        } else {
            alert("密碼不正確，點擊「🔍 調查按鈕」查看詳細線索！");
        }
    }

    function correctRemote() {
        alert("電視亮起，東翰留下的影片緩緩播放... 通關！");
        currentStage = 9;
        renderStage();
    }

    function wrongRemote() {
        alert("按鍵無反應，看看橘色貼紙的謎語！");
    }

    function showEnding(type) {
        let title = "", text = "";
        if (type === "good") {
            title = "💚 好結局：留一盞燈給你";
            text = "大門打開，東翰提著熱粥與胃藥站在門口，笑著說：『就算全部忘記也沒關係，我可以陪你再體驗一次……我都在。』";
        } else if (type === "bad1") {
            title = "🖤 壞結局一：撕開的溫柔";
            text = "大門打開後空無一人，鞋櫃上的信揭露了幫派奪權與臥底真相，溫柔全是精心佈局。";
        } else if (type === "bad2") {
            title = "💔 壞結局二：荒蕪的夢";
            text = "大門打開後是一片漆黑廢墟與殘破毛胚屋，所謂的家全是你腦傷後的孤獨幻想。";
        }

        document.getElementById("content-area").innerHTML = `
            <div class="story-box" style="border-left-color: #ef4444; padding: 20px;">
                <h2 style="color:#f59e0b; margin-bottom:10px;">${title}</h2>
                <p style="line-height: 1.8;">${text}</p>
            </div>
            <button onclick="restartGame()" class="submit-btn" style="background:#2563eb; margin-top:15px;">重新開始體驗</button>
        `;
        document.getElementById("stage-indicator").innerText = "遊戲劇終";
    }

    function showHint() {
        const stage = stages[currentStage];
        document.getElementById("modal-title").innerText = "💡 線索提示";
        document.getElementById("modal-text").innerHTML = stage.hint;
        document.getElementById("game-modal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("game-modal").style.display = "none";
    }

    function restartGame() {
        currentStage = 1;
        renderStage();
    }

    renderStage();
</script>

</body>
</html>
