<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>記憶重構 - 台灣在地密室逃脫</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d0d0d; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        #game-container { width: 100%; max-width: 480px; height: 100vh; max-height: 880px; background: #181818; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        @media (min-width: 481px) { #game-container { border-radius: 16px; height: 92vh; border: 1px solid #333; box-shadow: 0 0 30px rgba(0,0,0,0.9); } }
        
        header { background: #222; padding: 12px 15px; text-align: center; border-bottom: 2px solid #dc2626; }
        header h1 { font-size: 1.1rem; color: #ef4444; letter-spacing: 2px; }
        .stage-indicator { font-size: 0.8rem; color: #9ca3af; margin-top: 3px; }
        
        .content-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .search-area-title { font-size: 0.85rem; color: #f59e0b; font-weight: bold; margin-bottom: 5px; text-align: center; }
        .search-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .search-btn { background: #262626; border: 1px solid #444; color: #38bdf8; padding: 12px 8px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: all 0.2s; }
        .search-btn:active { background: #0284c7; color: #fff; transform: scale(0.98); }
        
        .story-box { background: #222; padding: 12px 15px; border-radius: 8px; border-left: 4px solid #dc2626; font-size: 0.9rem; line-height: 1.5; color: #e5e5e5; }
        
        .puzzle-box { background: #222; padding: 12px 15px; border-radius: 8px; text-align: center; border: 1px solid #3b3b3b; }
        .puzzle-box p { font-size: 0.85rem; margin-bottom: 10px; color: #f59e0b; font-weight: 500; }
        
        input[type="password"], input[type="text"] { width: 100%; padding: 12px; font-size: 1.2rem; text-align: center; background: #121212; border: 1px solid #4b5563; border-radius: 6px; color: #34d399; letter-spacing: 4px; font-family: monospace; margin-bottom: 10px; }
        button.submit-btn { width: 100%; padding: 12px; background: #dc2626; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button.submit-btn:active { background: #991b1b; }
        
        .footer-nav { display: flex; gap: 10px; padding: 12px 15px; background: #222; border-top: 1px solid #333; }
        .footer-nav button { flex: 1; padding: 10px; background: #374151; color: white; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: bold; }
        .footer-nav button.primary { background: #dc2626; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 100; display: none; }
        .modal-content { background: #1f2937; padding: 20px; border-radius: 12px; max-width: 400px; width: 100%; text-align: center; border: 1px solid #4b5563; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-content h3 { color: #f59e0b; margin-bottom: 12px; font-size: 1.1rem; }
        .modal-content p { font-size: 0.9rem; line-height: 1.6; color: #d1d5db; text-align: left; margin-bottom: 15px; }
        .modal-content button { padding: 10px 20px; background: #f59e0b; border: none; border-radius: 6px; color: #000; font-weight: bold; width: 100%; }

        .remote-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .remote-btn { padding: 12px 5px; background: #374151; color: #fff; border: 1px solid #4b5563; border-radius: 6px; font-size: 0.8rem; }
        .remote-btn.home-target { background: #ea580c; border-color: #f97316; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <h1 id="game-title">記憶重構</h1>
        <div class="stage-indicator" id="stage-indicator">第一關：臥室（槍傷驚醒）</div>
    </header>

    <div class="content-area" id="content-area"></div>

    <div class="footer-nav">
        <button onclick="showHint()">💡 搜查提示</button>
        <button class="primary" onclick="restartGame()">🔄 重新開始</button>
    </div>
</div>

<div class="modal" id="game-modal">
    <div class="modal-content">
        <h3 id="modal-title">翻找發現</h3>
        <p id="modal-text">細節內容...</p>
        <button onclick="closeModal()">放回原處</button>
    </div>
</div>

<script>
    let currentStage = 1;

    const stages = {
        1: {
            title: "第一關：臥室（槍傷驚醒）",
            story: "頭痛欲裂地醒來，身上散發著血腥味。你必須在房間裡東翻西找，找出自己的真實身分與解鎖密碼。",
            searchButtons: [
                { title: "🔍 翻看枕頭下", text: "【帶血黑色手槍】：槍身側面刻著文字：『順天會火堂 2021.05.18 入會』。" },
                { title: "🔍 翻動床頭櫃抽屜", text: "【便利貼】：『敬偉，記得按時吃藥。別忘記你最初加入幫派的那一天。』" },
                { title: "🔍 檢查衣櫃暗格", text: "【舊相片】：裡面是一張林敬偉的幫派刺青照片，生日寫著：2003.02.15。" }
            ],
            puzzleTitle: "請輸入手槍刻上的入會月日 (4位數 MMDD)",
            type: "input",
            answer: "0518",
            hint: "翻看枕頭下的手槍，上面刻有入會日期 05 月 18 日 (0518)。",
            next: 2
        },
        2: {
            title: "第二關：浴室（水霧與藥盒）",
            story: "熱水蒸氣瀰漫浴室，你覺得頭暈目眩，開始懷疑自己的大腦是否有問題...",
            searchButtons: [
                { title: "🔍 擦拭鏡面水霧", text: "【鏡子】：水霧散開，顯現出紅筆寫下的密碼：『4829』。" },
                { title: "🔍 翻開洗手台藥袋", text: "【精神科處方箋】：『病歷號 ICU-081299。警告：患者具嚴重創傷後妄想與人格分裂。』<br>⚠️ 誤導伏筆：這組病歷號 081299 似乎暗藏某種結局..." },
                { title: "🔍 翻找垃圾桶", text: "【空藥瓶】：強效鎮定劑與神經修復藥物。" }
            ],
            puzzleTitle: "請輸入鏡中顯示的 4 位數密碼",
            type: "input",
            answer: "4829",
            hint: "擦拭鏡面可看到 4829。藥袋上的 081299 則是一組危險的病歷號密碼！",
            next: 3
        },
        3: {
            title: "第三關：廚房（胃痛與雞湯）",
            story: "胃部劇烈翻騰，你必須打開貼著備料單的密碼冰箱拿藥。",
            searchButtons: [
                { title: "🔍 翻閱牆上食譜", text: "【剝皮辣椒雞湯】：仿土雞$380、剝皮辣椒$120、香菇$85、米酒$65、老薑$35、青蔥$40、蛤蜊$40。" },
                { title: "🔍 檢查廚房抽屜", text: "【圍裙】：口袋裡有一張發票，上面寫著『謝謝你總是煮雞湯給我喝 — 東翰』。" }
            ],
            puzzleTitle: "請計算並輸入食材總金額 (加總開鎖)",
            type: "input",
            answer: "765",
            hint: "將食譜上的食材金額加總：380+120+85+65+35+40+40 = 765。",
            next: 4
        },
        4: {
            title: "第四關：客廳（交往紀念）",
            story: "客廳冷清寂靜，全身鏡上貼著詭異的警告...",
            searchButtons: [
                { title: "🔍 翻看桌上相框", text: "【墾丁海邊合照】：背後寫著『2022.10.24 確定關係的第一天，陽光真好。』" },
                { title: "🔍 撕下鏡上黑紙", text: "【警告字條】：『這裡根本沒有別人，一切都是你自己想出來的。』" }
            ],
            puzzleTitle: "請輸入確定交往的日子 (4位數 MMDD)",
            type: "input",
            answer: "1024",
            hint: "墾丁合照背後的日期是 10 月 24 日 (1024)。",
            next: 5
        },
        5: {
            title: "第五關：更衣室（溫暖毛衣）",
            story: "打開衣櫃，有一件親手織的針織毛衣...",
            searchButtons: [
                { title: "🔍 翻看毛衣口袋", text: "【手寫吊牌】：『送給敬偉的聖誕禮物。12.25 天冷要穿暖。』" },
                { title: "🔍 搜查皮夾克內袋", text: "【身分證】：李東翰，生日 2000.04.10。" }
            ],
            puzzleTitle: "請輸入送毛衣的聖誕節日 (4位數 MMDD)",
            type: "input",
            answer: "1225",
            hint: "聖誕禮物吊牌日期為 12 月 25 日 (1225)。另外上記下李東翰的生日！",
            next: 6
        },
        6: {
            title: "第六關：床頭（媽祖與病歷）",
            story: "床頭櫃上擺著平安符與一張令人生疑的文件...",
            searchButtons: [
                { title: "🔍 翻開平安符", text: "【大甲鎮瀾宮符水】：『媽祖聖誕求得（農曆三月二十三日）。』" },
                { title: "🔍 抽出一旁的病歷", text: "【重症通知】：『患者林敬偉，腦部受創，加護病房編號 081299。』" }
            ],
            puzzleTitle: "請輸入農曆媽祖聖誕日 (4位數 MMDD)",
            type: "input",
            answer: "0323",
            hint: "農曆三月二十三日 ➔ 輸入 0323。",
            next: 7
        },
        7: {
            title: "第七關：書房（幫派叛變疑雲）",
            story: "書房裡散落著黑道帳本與秘密保險箱，氣氛極度不尋常！",
            searchButtons: [
                { title: "🔍 翻閱幫派秘密帳本", text: "【帳本紀錄】：『黑龍會徽章代號 HL-08，秘密匯款日期 0713。』<br>⚠️ 誤導伏筆：這暗示著叛變暗號 080713 或黑道代碼 791300！" },
                { title: "🔍 檢查保險箱夾層", text: "【資產轉移單】：上面赫然簽著東翰的名字，還有兩張前往東南亞的單程機票..." }
            ],
            puzzleTitle: "請輸入保險箱密碼 (6位數)",
            type: "input",
            answer: "080713",
            hint: "輸入帳本密碼 080713 開啟保險箱（此處會深深懷疑東翰叛變）。",
            next: 8
        },
        8: {
            title: "第八關：電視（遙控器謎語）",
            story: "電視遙控器貼滿彩色貼紙，旁邊留著東翰的溫柔留言...",
            searchButtons: [
                { title: "🔍 閱讀遙控器貼紙", text: "『敬偉，你總說黑色太冷...第一次把你抱在懷裡那天，陽光把天空染成最溫暖的顏色。那個顏色的 HOME 標籤是我留給你的回家符號。』" }
            ],
            puzzleTitle: "請點擊遙控器上貼著橘色貼紙的按鈕",
            type: "remote",
            next: 9
        },
        9: {
            title: "第九關：玄關（鹽酥雞告白）",
            story: "走到大門附近的鞋櫃，記憶碎片開始重組...",
            searchButtons: [
                { title: "🔍 翻開舊相簿", text: "【鹽酥雞攤照片】：『2023.08.07 東翰滿嘴食物向我告白成功！』" },
                { title: "🔍 查看單程機票", text: "【機票】：台北飛曼谷，乘客：李東翰、林敬偉（兩張票！原來他要帶你離開幫派！）" }
            ],
            puzzleTitle: "請輸入告白日 (4位數 MMDD)",
            type: "input",
            answer: "0807",
            hint: "鹽酥雞攤告白日為 8 月 7 日 ➔ 0807。",
            next: 10
        },
        10: {
            title: "第十關：大門口（終極命運抉擇）",
            story: "站在大門電子鎖前，所有翻找出來的線索在腦中交織。你究竟要相信愛情、相信幫派背叛，還是相信自己只是個精神病患？",
            searchButtons: [
                { title: "🔍 彙整【真相線索】", text: "【兩人生日總加】<br>林敬偉 (2003.02.15) ➔ 2003 + 2 + 15 = 2020<br>李東翰 (2000.04.10) ➔ 2000 + 4 + 10 = 2014<br>總和：2020 + 2014 = 💚 4034 (信任與真相)" },
                { title: "🔍 彙整【黑道叛變線索】", text: "黑龍會暗號與帳本匯款代碼 🖤 791300 / 080713 (懷疑背叛)" },
                { title: "🔍 彙整【精神病患線索】", text: "加護病房與精神科病歷號 💔 081299 (幻覺失智)" }
            ],
            puzzleTitle: "請輸入終極密碼 (輸入 4034、791300 或 081299)",
            type: "input",
            answer: "4034",
            hint: "好結局密碼：4034。黑道壞結局：791300。病患壞結局：081299。",
            next: "end"
        }
    };

    function renderStage() {
        const stage = stages[currentStage];
        document.getElementById("game-title").innerText = "記憶重構";
        document.getElementById("stage-indicator").innerText = stage.title;

        let searchBtnsHtml = "";
        if (stage.searchButtons) {
            searchBtnsHtml = `<div class="search-area-title">👇 點擊下方地點進行現場搜查翻找：</div><div class="search-grid">`;
            stage.searchButtons.forEach((btn, idx) => {
                searchBtnsHtml += `<button class="search-btn" onclick="inspectDetail(${idx})">${btn.title}</button>`;
            });
            searchBtnsHtml += `</div>`;
        }

        let html = `
            <div class="story-box">${stage.story}</div>
            ${searchBtnsHtml}
        `;

        if (stage.type === "input") {
            html += `
                <div class="puzzle-box">
                    <p>${stage.puzzleTitle}</p>
                    <input type="password" id="user-input" placeholder="輸入密碼..." autocomplete="off">
                    <button class="submit-btn" onclick="checkInput()">確認解鎖</button>
                </div>
            `;
        } else if (stage.type === "remote") {
            html += `
                <div class="puzzle-box">
                    <p>${stage.puzzleTitle}</p>
                    <div class="remote-grid">
                        <button class="remote-btn" onclick="wrongRemote()">電源</button>
                        <button class="remote-btn" onclick="wrongRemote()">選單</button>
                        <button class="remote-btn home-target" onclick="correctRemote()">🏠 HOME (橘)</button>
                        <button class="remote-btn" onclick="wrongRemote()">音量+</button>
                        <button class="remote-btn" onclick="wrongRemote()">頻道+</button>
                        <button class="remote-btn" onclick="wrongRemote()">返回</button>
                    </div>
                </div>
            `;
        }

        document.getElementById("content-area").innerHTML = html;
    }

    function inspectDetail(index) {
        const stage = stages[currentStage];
        const item = stage.searchButtons[index];
        document.getElementById("modal-title").innerText = item.title;
        document.getElementById("modal-text").innerHTML = item.text;
        document.getElementById("game-modal").style.display = "flex";
    }

    function checkInput() {
        const val = document.getElementById("user-input").value.trim();
        const stage = stages[currentStage];

        if (currentStage === 10) {
            if (val === "4034") showEnding("good");
            else if (val === "791300" || val === "080713") showEnding("bad1");
            else if (val === "081299") showEnding("bad2");
            else alert("密碼錯誤！請再次翻找線索。");
            return;
        }

        if (val === stage.answer || (currentStage === 7 && (val === "791300" || val === "080713"))) {
            if (currentStage === 7 && (val === "791300" || val === "080713")) {
                alert("你選擇了懷疑... 保險箱彈開，裡面全是黑道密件。");
            } else {
                alert("解密成功！");
            }
            currentStage = stage.next;
            renderStage();
        } else {
            alert("密碼不正確！請點擊上方按鈕翻找更多細節。");
        }
    }

    function correctRemote() {
        alert("電視亮起，東翰留下的影片播放... 通關！");
        currentStage = 9;
        renderStage();
    }

    function wrongRemote() { alert("按鍵無反應，看看橘色貼紙謎語！"); }

    function showEnding(type) {
        let title = "", text = "";
        if (type === "good") {
            title = "💚 真相好結局：留一盞燈給你 (4034)";
            text = "大門打開，東翰提著熱粥與胃藥站在門口，笑著說：『就算全部忘記也沒關係，我可以陪你再體驗一次……我都在。』原來他冒著生命危險準備機票，只是為了帶你遠離幫派過平淡生活。";
        } else if (type === "bad1") {
            title = "🖤 幫派壞結局一：撕開的溫柔 (791300 / 080713)";
            text = "被黑道疑雲吞噬的你舉槍對準門外。大門打開後空無一人，鞋櫃上的信揭露了幫派奪權與臥底真相，溫柔與陪伴全成了精心計算的局。";
        } else if (type === "bad2") {
            title = "💔 幻覺壞結局二：荒蕪的夢 (081299)";
            text = "大門打開後是一片漆黑廢墟與殘破毛胚屋。走廊盡頭傳來護士的聲音：『ICU-08 病患又發作了...』原來所謂的溫馨家園與東翰，全是你腦傷後的孤獨幻想。";
        }

        document.getElementById("content-area").innerHTML = `
            <div class="story-box" style="border-left-color: #dc2626; padding: 20px;">
                <h2 style="color:#f59e0b; margin-bottom:10px;">${title}</h2>
                <p style="line-height: 1.8;">${text}</p>
            </div>
            <button onclick="restartGame()" class="submit-btn" style="background:#2563eb; margin-top:15px;">重新開始體驗</button>
        `;
        document.getElementById("stage-indicator").innerText = "遊戲劇終";
    }

    function showHint() {
        const stage = stages[currentStage];
        document.getElementById("modal-title").innerText = "💡 搜查提示";
        document.getElementById("modal-text").innerHTML = stage.hint;
        document.getElementById("game-modal").style.display = "flex";
    }

    function closeModal() { document.getElementById("game-modal").style.display = "none"; }
    function restartGame() { currentStage = 1; renderStage(); }

    renderStage();
</script>

</body>
</html>
